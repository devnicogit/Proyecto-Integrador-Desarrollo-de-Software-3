<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><title>Figura 20 — Login EcoRoute</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:linear-gradient(135deg,#2563eb 0%,#1e40af 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:white;width:100%;max-width:420px;border-radius:16px;padding:40px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.logo{text-align:center;margin-bottom:32px}
.logo-icon{font-size:48px;margin-bottom:12px}
.logo h1{color:#2563eb;font-size:28px;margin-bottom:4px}
.logo p{color:#64748b;font-size:13px}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:6px;letter-spacing:.5px}
.form-group input{width:100%;padding:12px 14px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px;outline:none}
.form-group input:focus{border-color:#2563eb}
.btn{width:100%;padding:14px;background:#2563eb;color:white;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;margin-top:12px}
.btn:hover{background:#1e40af}
.error{background:#fee2e2;color:#991b1b;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
.footer{text-align:center;margin-top:24px;font-size:12px;color:#94a3b8}
.brand{margin-top:8px;font-weight:600;color:#475569}
</style></head>
<body>
<div class="card">
<div class="logo"><div class="logo-icon">🚚</div><h1>EcoRoute</h1><p>Sistema de Gestión Logística</p></div>
<div class="form-group"><label>CORREO ELECTRÓNICO</label><input type="email" value="admin@micotrans.com.pe" readonly></div>
<div class="form-group"><label>CONTRASEÑA</label><input type="password" value="••••••••••"></div>
<button class="btn">Iniciar sesión</button>
<div class="footer"><div>v1.0 — Mayo 2026</div><div class="brand">Grupo MICOTRANS S.A.C.</div></div>
</div>
</body></html>
